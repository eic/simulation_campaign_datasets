# PBEAM uses 115_Ru96 as a placeholder until an Ag beam configuration
# is available in the epic detector repository.
.eAg_9x115_variables: &eAg_9x115_variables
  EBEAM_OVERRIDE: "9"
  PBEAM_OVERRIDE: "115_Ru96"

DIS:eAg:9x115:nevents:
  variables:
    <<: *eAg_9x115_variables
  extends: .nevents
  parallel:
    matrix:
      - DATA:
        - "DIS/eAg/9x115/BeAGLE1.03.02-3.1_DIS_eAg_9x115_q2_1to10.csv"
        - "DIS/eAg/9x115/BeAGLE1.03.02-3.1_DIS_eAg_9x115_q2_10to100.csv"

DIS:eAg:9x115:timings:
  variables:
    <<: *eAg_9x115_variables
  extends: .timings
  needs:
    - DIS:eAg:9x115:nevents
  parallel:
    matrix:
      - DATA:
        - "DIS/eAg/9x115/BeAGLE1.03.02-3.1_DIS_eAg_9x115_q2_1to10.csv"
        - "DIS/eAg/9x115/BeAGLE1.03.02-3.1_DIS_eAg_9x115_q2_10to100.csv"

DIS:eAg:9x115:collect:
  variables:
    <<: *eAg_9x115_variables
  extends: .collect
  needs:
    - DIS:eAg:9x115:timings
