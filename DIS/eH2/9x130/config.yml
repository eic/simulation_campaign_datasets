.eH2_9x130_variables: &eH2_9x130_variables
  EBEAM_OVERRIDE: "9"
  PBEAM_OVERRIDE: "130_H2"

DIS:eH2:9x130:nevents:
  variables:
    <<: *eH2_9x130_variables
  extends: .nevents
  parallel:
    matrix:
      - DATA:
        - "DIS/eH2/9x130/BeAGLE1.03.02-3.1_DIS_eH2_en_9x130_q2_1to1000.csv"
        - "DIS/eH2/9x130/BeAGLE1.03.02-3.1_DIS_eH2_ep_9x130_q2_1to1000.csv"

DIS:eH2:9x130:timings:
  variables:
    <<: *eH2_9x130_variables
  extends: .timings
  needs:
    - DIS:eH2:9x130:nevents
  parallel:
    matrix:
      - DATA:
        - "DIS/eH2/9x130/BeAGLE1.03.02-3.1_DIS_eH2_en_9x130_q2_1to1000.csv"
        - "DIS/eH2/9x130/BeAGLE1.03.02-3.1_DIS_eH2_ep_9x130_q2_1to1000.csv"

DIS:eH2:9x130:collect:
  variables:
    <<: *eH2_9x130_variables
  extends: .collect
  needs:
    - DIS:eH2:9x130:timings
